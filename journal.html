<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trade Journal — ChartPro</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/scanner.css">
<link rel="stylesheet" href="css/journal.css">
</head>
<body>

<header id="top-toolbar">
  <div class="toolbar-group brand">
    <i class="fa-solid fa-chart-line brand-icon"></i>
    <span class="brand-name">ChartPro</span>
  </div>
  <a href="index.html" class="icon-btn nav-link"><i class="fa-solid fa-chart-column"></i><span class="btn-text">Chart</span></a>
  <a href="scanner.html" class="icon-btn nav-link"><i class="fa-solid fa-magnifying-glass-chart"></i><span class="btn-text">Scanner</span></a>
  <span class="icon-btn active" style="cursor:default"><i class="fa-solid fa-book"></i><span class="btn-text">Journal</span></span>
  <div class="toolbar-spacer"></div>
  <button id="new-trade-btn" class="calc-btn" style="width:auto;padding:8px 16px">
    <i class="fa-solid fa-plus"></i> Log Trade
  </button>
</header>

<div id="journal-body">
  <div id="jr-stats">
    <div class="sum-card"><label>Trades</label><span id="js-total">—</span></div>
    <div class="sum-card"><label>Win rate</label><span id="js-winrate">—</span></div>
    <div class="sum-card"><label>Total PnL</label><span id="js-pnl">—</span></div>
    <div class="sum-card"><label>Avg win</label><span id="js-avgwin" class="up">—</span></div>
    <div class="sum-card"><label>Avg loss</label><span id="js-avgloss" class="down">—</span></div>
    <div class="sum-card"><label>Open</label><span id="js-open">—</span></div>
  </div>

  <div id="jr-table-wrap">
    <table id="jr-table">
      <thead>
        <tr>
          <th>Date</th><th>Symbol</th><th>Side</th>
          <th class="num">Entry</th><th class="num">Exit</th><th class="num">Qty</th>
          <th class="num">PnL</th><th>Status</th><th class="hide-sm">Notes</th><th></th>
        </tr>
      </thead>
      <tbody id="jr-tbody"></tbody>
    </table>
    <div id="jr-empty" class="hidden">No trades logged yet. Click <b>Log Trade</b> to add your first one.</div>
  </div>
</div>

<footer id="status-bar">
  <span class="status-note">Trades are stored in your project database via the Table API</span>
</footer>

<!-- Trade form modal -->
<div id="trade-modal" class="modal hidden">
  <div class="modal-box calc-box">
    <div class="modal-head">
      <i class="fa-solid fa-book"></i>
      <span class="modal-title" id="trade-modal-title">Log Trade</span>
      <button id="trade-close" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="calc-body">
      <label class="calc-row"><span>Symbol</span><input type="text" id="tr-symbol" placeholder="BTCUSDT"></label>
      <label class="calc-row"><span>Side</span>
        <select id="tr-side" class="tr-select"><option>LONG</option><option>SHORT</option></select>
      </label>
      <label class="calc-row"><span>Entry price</span><input type="number" id="tr-entry" step="any"></label>
      <label class="calc-row"><span>Exit price (blank = open)</span><input type="number" id="tr-exit" step="any"></label>
      <label class="calc-row"><span>Quantity</span><input type="number" id="tr-qty" step="any"></label>
      <label class="calc-row"><span>Stop-loss</span><input type="number" id="tr-stop" step="any"></label>
      <label class="calc-row"><span>Target</span><input type="number" id="tr-target" step="any"></label>
      <label class="calc-row notes-row"><span>Notes</span><textarea id="tr-notes" rows="3" placeholder="Setup, reason, lesson…"></textarea></label>
      <button id="trade-save" class="calc-btn">Save Trade</button>
    </div>
  </div>
</div>

<script src="js/journal.js"></script>
</body>
</html>
